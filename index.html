<!-- סקריפט התחברות, איסוף נתונים, הצגת זמן פעילות ומחיקה אוטומטית (TTL של 7 ימים) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, deleteDoc, doc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const configs = [
            { id: "hebrew-amharic-71f5d", shortName: "אמהרית", name: "עברית ⇄ אמהרית", flag: "🇪🇹", url: "https://geigner.github.io/hebrew-amharic-temp-room/", config: {
                apiKey: "AIzaSyBLjqBXkP8KVHPQzYXczeRvw09qT01-ySE",
                authDomain: "hebrew-amharic-71f5d.firebaseapp.com",
                projectId: "hebrew-amharic-71f5d",
                storageBucket: "hebrew-amharic-71f5d.firebasestorage.app",
                messagingSenderId: "701170625071",
                appId: "1:701170625071:web:8f3e6c9584cb7a823ff4da"
            }},
            { id: "hebrew-arabic", shortName: "ערבית", name: "עברית ⇄ ערבית", flag: "🇸🇦", url: "https://geigner.github.io/hebrew-arabic/", config: {
                apiKey: "AIzaSyBZ1ApM988biqiN5c_GfpBcG8mroEDH2cc",
                authDomain: "hebrew-arabic.firebaseapp.com",
                projectId: "hebrew-arabic",
                storageBucket: "hebrew-arabic.firebasestorage.app",
                messagingSenderId: "877240251900",
                appId: "1:877240251900:web:c71112877d762c5a31ae79"
            }},
            { id: "hebrew-italian", shortName: "איטלקית", name: "עברית ⇄ איטלקית", flag: "🇮🇹", url: "https://geigner.github.io/hebrew-italian/", config: {
                apiKey: "AIzaSyBuuzUfonWNNT_Zh2y_okFkpTX-81Qrb98",
                authDomain: "hebrew-italian.firebaseapp.com",
                projectId: "hebrew-italian",
                storageBucket: "hebrew-italian.firebasestorage.app",
                messagingSenderId: "426046162499",
                appId: "1:426046162499:web:018db50fe416fcb73736f6"
            }},
            { id: "hebrew-russian", shortName: "רוסית", name: "עברית ⇄ רוסית", flag: "🇷🇺", url: "https://geigner.github.io/hebrew-russian/", config: {
                apiKey: "AIzaSyBvcY2Rm-kkbVtPUUsclpN_I-z0V7-AnEY",
                authDomain: "hebrew-russian.firebaseapp.com",
                projectId: "hebrew-russian",
                storageBucket: "hebrew-russian.firebasestorage.app",
                messagingSenderId: "540341284755",
                appId: "1:540341284755:web:4c9847f131c494a775c266"
            }},
            { id: "hebrew-french", shortName: "צרפתית", name: "עברית ⇄ צרפתית", flag: "🇫🇷", url: "https://geigner.github.io/hebrew-french/", config: {
                apiKey: "AIzaSyBq_hHRhuFu6QfvxdkrN_S0rK17hZskIfo",
                authDomain: "hebrew-french.firebaseapp.com",
                projectId: "hebrew-french",
                storageBucket: "hebrew-french.firebasestorage.app",
                messagingSenderId: "1027136444686",
                appId: "1:1027136444686:web:e02cc664abd4c1fc8adf5f"
            }},
            { id: "hebrew-english", shortName: "אנגלית", name: "עברית ⇄ אנגלית", flag: "🇬🇧", url: "https://geigner.github.io/hebrew-english/", config: {
                apiKey: "AIzaSyCwiBVCup-VIjX4VYEE5ay2HlHoDAaIFyA",
                authDomain: "hebrew-english.firebaseapp.com",
                projectId: "hebrew-english",
                storageBucket: "hebrew-english.firebasestorage.app",
                messagingSenderId: "132280229208",
                appId: "1:132280229208:web:aa671fef2c69aeffd6d92d"
            }}
        ];

        let globalRoomsCache = [];
        let currentFilter = 'all';
        const TTL_HOURS = 24 * 7; // מחיקה אוטומטית לאחר 7 ימים של חוסר פעילות

        window.fetchAllRooms = async function() {
            const tableBody = document.getElementById("live-rooms-body");
            tableBody.innerHTML = `<tr><td colspan="4" class="no-rooms">סורק נתונים מחדש מכל הפרויקטים...</td></tr>`;
            
            globalRoomsCache = [];
            const now = new Date();

            for (let item of configs) {
                try {
                    const secondaryApp = initializeApp(item.config, "app-" + item.config.projectId);
                    const secondaryDb = getFirestore(secondaryApp);
                    const querySnapshot = await getDocs(collection(secondaryDb, "rooms"));
                    
                    if (!querySnapshot.empty) {
                        for (let roomDoc of querySnapshot.docs) {
                            const data = roomDoc.data();
                            const roomId = roomDoc.id;

                            // בדיקת ההודעה האחרונה בחדר כדי לדייק את זמן הפעילות
                            let lastActivityTime = data.createdAt ? (data.createdAt.toDate ? data.createdAt.toDate() : new Date(data.createdAt)) : new Date(0);
                            
                            try {
                                const msgQuery = query(collection(secondaryDb, "rooms", roomId, "messages"), orderBy("timestamp", "desc"), limit(1));
                                const msgSnap = await getDocs(msgQuery);
                                if (!msgSnap.empty) {
                                    const msgData = msgSnap.docs[0].data();
                                    if (msgData.timestamp) {
                                        const msgDate = msgData.timestamp.toDate ? msgData.timestamp.toDate() : new Date(msgData.timestamp);
                                        if (msgDate > lastActivityTime) {
                                            lastActivityTime = msgDate;
                                        }
                                    }
                                }
                            } catch (err) {}

                            // חישוב הפרש שעות לצורך בדיקת TTL (7 ימים)
                            const hoursDiff = (now - lastActivityTime) / (1000 * 60 * 60);

                            if (hoursDiff > TTL_HOURS) {
                                // מחיקה אוטומטית שקטה של חדר שעבר שבוע
                                try {
                                    await deleteDoc(doc(secondaryDb, "rooms", roomId));
                                    console.log(`החדר הישן ${roomId} ב-${item.shortName} נמחק אוטומטית.`);
                                } catch (delErr) {}
                                continue;
                            }

                            globalRoomsCache.push({
                                projectId: item.id,
                                shortName: item.shortName,
                                name: item.name,
                                flag: item.flag,
                                url: item.url,
                                roomId: roomId,
                                lastActivity: lastActivityTime,
                                dbInstance: secondaryDb
                            });
                        }
                    }
                } catch (error) {
                    console.error(`שגיאה בטעינת נתונים עבור ${item.name}:`, error);
                }
            }

            updateFilterBar();
            renderRooms();
        }

        function updateFilterBar() {
            const filterBar = document.getElementById("filter-bar");
            const activeProjects = [...new Map(globalRoomsCache.map(item => [item.projectId, item])).values()];

            let barHTML = `<button class="filter-chip ${currentFilter === 'all' ? 'active' : ''}" onclick="filterRooms('all', this)">הכל</button>`;

            activeProjects.forEach(proj => {
                const isActive = currentFilter === proj.projectId ? 'active' : '';
                barHTML += `<button class="filter-chip ${isActive}" onclick="filterRooms('${proj.projectId}', this)">${proj.shortName}</button>`;
            });

            filterBar.innerHTML = barHTML;

            if (currentFilter !== 'all' && !activeProjects.some(p => p.projectId === currentFilter)) {
                currentFilter = 'all';
            }
        }

        window.renderRooms = function() {
            const tableBody = document.getElementById("live-rooms-body");
            const counterBadge = document.getElementById("rooms-counter");
            
            const filteredRooms = currentFilter === 'all' 
                ? globalRoomsCache 
                : globalRoomsCache.filter(r => r.projectId === currentFilter);

            // מיון לפי הפעילות האחרונה (החדש ביותר למעלה)
            filteredRooms.sort((a, b) => b.lastActivity - a.lastActivity);

            counterBadge.textContent = `${globalRoomsCache.length} פעילים`;

            if (filteredRooms.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="no-rooms">אין כרגע חדרים פעילים.</td></tr>`;
                return;
            }

            let html = "";
            filteredRooms.forEach(room => {
                const timeString = room.lastActivity.getTime() === 0 ? 'אין פעילות' : room.lastActivity.toLocaleString('he-IL', {
                    dateStyle: 'short',
                    timeStyle: 'short'
                });

                const roomUrlWithParam = `${room.url}?room=${encodeURIComponent(room.roomId)}`;

                html += `
                    <tr>
                        <td>${room.flag} ${room.name}</td>
                        <td><code>${room.roomId}</code></td>
                        <td style="font-size: 0.85rem; color: #57606a;">🕒 ${timeString}</td>
                        <td>
                            <div style="display: flex; gap: 8px; align-items: center;">
                                <a href="${roomUrlWithParam}" target="_blank" style="color: var(--accent-color); text-decoration: none; font-weight: 500;">פתח 👁️</a>
                                <button onclick="manualDeleteRoom('${room.projectId}', '${room.roomId}')" style="background: #fee2e2; color: #dc2626; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.75rem;">מחק 🗑️</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            tableBody.innerHTML = html;
        }

        window.filterRooms = function(projectId, btnElement) {
            currentFilter = projectId;
            document.querySelectorAll('.filter-chip').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            renderRooms();
        }

        window.manualDeleteRoom = async function(projectId, roomId) {
            if (confirm(`למחוק את החדר "${roomId}" לצמיתות?`)) {
                const projConfig = configs.find(c => c.id === projectId);
                if (!projConfig) return;
                try {
                    const secondaryApp = initializeApp(projConfig.config, "app-del-" + Math.random());
                    const secondaryDb = getFirestore(secondaryApp);
                    await deleteDoc(doc(secondaryDb, "rooms", roomId));
                    alert("החדר נמחק בהצלחה!");
                    fetchAllRooms();
                } catch (e) {
                    alert("שגיאה במחיקת החדר.");
                }
            }
        }

        // טעינה ראשונית
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(fetchAllRooms, 100);
        });
    </script>
